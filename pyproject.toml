[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research"
version = "0.1.0"
description = "Executable supplement for bounded-returns deep-research orchestration experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Peter McCann Strain"}]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
api = [
    "openai>=2.24.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiolimiter>=1.1.0",
    "aiohttp>=3.9.0",
    "arxiv>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "tavily-python>=0.7.0",
    "trafilatura>=2.0.0",
]
paper = [
    "numpy>=1.26.0",
    "pandas>=2.3.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.8.0",
    "scikit-posthocs>=0.11.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
]
dev = ["pytest>=9.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.8.0"]
publish = ["huggingface-hub>=1.26.0"]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.setuptools.packages.find]
include = ["deep_research*"]
exclude = ["tests*", "scripts*", "papers*", "reports*", "artifacts*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    "venv",
    ".venv",
    ".cudatk",
    "artifacts",
    "results",
    "external_frameworks",
    "scratchpad*",
    "papers/paper_a_bounded_returns/submission_tmlr",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    ".cudatk",
    "artifacts",
    "results",
    "external_frameworks",
    "scratchpad*",
]
